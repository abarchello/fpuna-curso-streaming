[project]
name = "hidromet-streaming"
version = "0.1.0"
description = "Telemetría hidro-meteorológica end-to-end con Kafka, Apache Beam, Flink y Marimo"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "altair>=5.5,<6",
  "apache-beam==2.74.0",
  "betterproto==2.0.0b6",
  "confluent-kafka>=2.8,<3",
  "marimo>=0.19,<1",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pip>=25,<27",
  "pyarrow>=18,<21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hidromet_streaming"]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requiere la pila Docker Compose"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"*_notebook.py" = ["B018", "E501"]  # tablas Markdown dentro de mo.md
"src/hidromet_streaming/transforms.py" = ["B008"]
